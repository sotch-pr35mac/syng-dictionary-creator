[package]
name = "syng-dictionary-creator"
version = "4.0.0"
authors = ["Preston Wang-Stosur-Bassett <p.wanstobas@gmail.com>"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = "1.3.3"
flate2 = "1.1.9"
fst = "0.4"
hsk = "1.0.0"
prettify_pinyin = "2.0.0"
regex = "1.12.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.27.0"
