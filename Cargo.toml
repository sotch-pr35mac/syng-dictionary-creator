[package]
name = "syng-dictionary-creator"
version = "4.0.0"
authors = ["Preston Wang-Stosur-Bassett <p.wanstobas@gmail.com>"]
description = "Deterministic multi-source Chinese-English dictionary bundle builder"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/sotch-pr35mac/syng-dictionary-creator"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.9"
fst = "0.4"
hsk = "1.0.0"
prettify_pinyin = "2.0.0"
percent-encoding = "2.3.2"
regex = "1.12.3"
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "aligned", "pointer_width_32"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tar = "0.4.44"
unicode-normalization = "0.1.25"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"
